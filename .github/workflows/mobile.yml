name: Mobile

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: kinko-mobile

jobs:
  checks:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: kinko-mobile/yarn.lock

      # One lockfile: yarn.lock. A package-lock.json would resolve different
      # versions than CI tests, and --frozen-lockfile fails if yarn.lock is stale.
      - name: Check there is only one lockfile
        run: |
          if [ -e package-lock.json ]; then
            echo "::error file=kinko-mobile/package-lock.json::This app uses Yarn. Delete package-lock.json and run yarn install."
            exit 1
          fi

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test --ci
