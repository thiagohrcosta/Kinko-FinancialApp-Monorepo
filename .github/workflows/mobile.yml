name: Mobile

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: kinko-mobile

jobs:
  checks:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: kinko-mobile/yarn.lock

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test --ci
