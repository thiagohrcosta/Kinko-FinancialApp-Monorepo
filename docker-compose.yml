services:
  backend:
    build: ./backend
    container_name: kinko_backend
    # The bundle_cache volume outlives image rebuilds, so install any gems
    # added to Gemfile.lock since it was created before booting.
    command: bash -c "rm -f tmp/pids/server.pid && (bundle check || bundle install) && rails s -b 0.0.0.0"
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - db

  web:
    build: ./web
    container_name: kinko_web
    command: npm run dev
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3001"
    environment:
      WATCHPACK_POLLING: "true"
      # Next.js calls Rails server-side (BFF) over the compose network
      API_BASE_URL: "http://backend:3000"
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      - backend

  db:
    image: postgres:16
    container_name: kinko_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kinko_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
  storage_data:
  bundle_cache: